apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fc-control-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/nimeshamin/test_cluster_k8s_app.git
    targetRevision: firecracker
    path: apps/fc-control-plane/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: fc-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    # fc-agent is privileged (jailer, /dev/kvm); say so explicitly rather than
    # inheriting the cluster default.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
