# fc-agent: one per Firecracker node (firecracker=true, the GKE nested-virt
# pool). Runs VMs with the jailer using the binaries, kernel and rootfs that
# firecracker-host (test_cluster_k8s_base) stages in /var/lib/firecracker, and
# waits for that staging before syncing.
#
# /var/lib/firecracker is the reflink-capable XFS store that firecracker-host
# mounts; HostToContainer propagation lets this pod see that mount even if it
# starts first. Each VM's disk (vms/<id>/rootfs.ext4) is a reflink clone of a
# read-only base image in images/<name>/, removed when the VM is deleted.
# Images the node lacks are pulled from fc-images on demand; pulled images
# unused for FC_IMAGE_TTL are removed.
#
# VMs run inside this pod: restarting or upgrading it reboots the node's VMs.
# Their disks persist under /var/lib/firecracker/vms.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fc-agent
  labels:
    app.kubernetes.io/name: fc-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fc-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fc-agent
    spec:
      # GHCR packages from the private test_control_plane repo. Created out of
      # band (never committed): see apps/fc-control-plane/README.md.
      imagePullSecrets:
        - name: ghcr-pull
      serviceAccountName: fc-agent
      nodeSelector:
        firecracker: "true"
      tolerations:
        - key: firecracker
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Time for guests to shut down on SendCtrlAltDel.
      terminationGracePeriodSeconds: 30
      containers:
        - name: fc-agent
          image: fc-agent
          env:
            - name: FC_API_URL
              value: http://fc-api.fc-system.svc.cluster.local:8080
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FC_ROOT
              value: /var/lib/firecracker
            - name: FC_IMAGE_SERVER_URL
              value: http://fc-images.fc-system.svc.cluster.local:8080
            - name: FC_IMAGE_TTL
              value: 1h
            - name: FC_API_TOKEN_FILE
              value: /var/run/secrets/fc-api/token
          securityContext:
            # The jailer needs mknod, chroot, pivot_root and setuid.
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: firecracker-root
              mountPath: /var/lib/firecracker
              mountPropagation: HostToContainer
            - name: kvm
              mountPath: /dev/kvm
            - name: fc-api-token
              mountPath: /var/run/secrets/fc-api
              readOnly: true
      volumes:
        - name: firecracker-root
          hostPath:
            path: /var/lib/firecracker
            type: DirectoryOrCreate
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        # Token for fc-api, bound to this pod (and so to this node), rotated
        # by the kubelet.
        - name: fc-api-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: fc-api
                  expirationSeconds: 3600
                  path: token
