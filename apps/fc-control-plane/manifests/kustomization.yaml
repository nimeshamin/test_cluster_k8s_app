apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fc-system
resources:
  - rbac.yaml
  - networkpolicy.yaml
  - api.yaml
  - agent.yaml
  - images.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: fc-control-plane
# Built by test_control_plane's images workflow. Bump all tags together.
images:
  - name: fc-api
    newName: ghcr.io/nimeshamin/test-control-plane/fc-api
    newTag: "0.7.0"
  - name: fc-agent
    newName: ghcr.io/nimeshamin/test-control-plane/fc-agent
    newTag: "0.7.0"
  - name: fc-images
    newName: ghcr.io/nimeshamin/test-control-plane/fc-images
    newTag: "0.7.0"
