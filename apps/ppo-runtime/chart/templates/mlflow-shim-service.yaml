# The trainer image's launch-trainer.sh hardcodes
#   export MLFLOW_TRACKING_URI=http://mlflow:5000
# which overrides whatever env we set on the pod. Since the trainer runs in
# the experiments namespace and MLflow lives in the mlflow namespace, `mlflow`
# wouldn't otherwise resolve. This ExternalName Service makes the short
# name resolvable from the trainer/worker pods without modifying the image.
# Remove once the launch script is updated to honor an existing
# MLFLOW_TRACKING_URI (e.g. `${MLFLOW_TRACKING_URI:-http://mlflow:5000}`).
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: {{ .Values.experimentsNamespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/part-of: ppo-training
spec:
  type: ExternalName
  externalName: mlflow.mlflow.svc.cluster.local
  ports:
    - name: http
      port: 5000
      targetPort: 5000
