apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ppo-runtime
  namespace: argocd
  annotations:
    # Sync after kubeflow-crds (20) and kubeflow-pipelines (25) so the
    # WorkflowTemplate CRD exists by the time we apply this Application.
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/nimeshamin/test_cluster_k8s_app.git
    targetRevision: main
    path: apps/ppo-runtime/chart
    helm:
      releaseName: ppo-runtime
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
